# The smallest useful config: install dependencies when herdr creates a
# worktree, and offer to do it again when herdr opens an existing one.
version = 1

[[step]]
name = "install"
on = "create"
run = "npm ci"
timeout = "15m"
# A notification when the install starts, and another when it ends: a long
# install is visible without the HUD. Leave it out to get only the run's
# summary at the end.
notify = "all"

[[step]]
name = "reinstall"
on = "open"
mode = "suggest"
run = "npm ci"
timeout = "15m"
